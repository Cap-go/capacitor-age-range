name: Build source code and test it

on:
  push:
    branches:
      - renovate/**
  pull_request:
    branches: [ main ]
  workflow_call:  # Allow this workflow to be called by other workflows

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard_swiftpm_version:
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Check out
        uses: actions/checkout@v6
      - name: Enforce capacitor-swift-pm version
        run: |
          set -euo pipefail
          if ! grep -Eq 'https://github.com/ionic-team/capacitor-swift-pm\.git"[[:space:]]*,[[:space:]]*from:[[:space:]]*"8\.0\.0"' Package.swift; then
            echo "Expected capacitor-swift-pm to be pinned to 8.0.0 in Package.swift"
            exit 1
          fi
  build_android:
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        android_play_age_signals_version: ['0.0.4', '0.0.6']
    name: build_android (Play Age Signals ${{ matrix.android_play_age_signals_version }})
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Check out
        uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        id: install_code
        run: bun i
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Check Cap 9 deprecated APIs
        run: bun run check:cap9-deprecated
      - name: Setup java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Build
        id: build_code
        run: |
          for attempt in 1 2 3; do
            if (cd android && ./gradlew clean build test -PandroidPlayAgeSignalsVersion=${{ matrix.android_play_age_signals_version }}); then
              exit 0
            fi
            echo "Gradle build failed (attempt ${attempt}/3); retrying after 15s"
            sleep 15
          done
          exit 1
  build_ios:
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: macOS-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Check out
        uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        id: install_code
        run: bun i
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Check Cap 9 deprecated APIs
        run: bun run check:cap9-deprecated
      - name: Build
        id: build_code
        run: bun run verify:ios
      - name: Build iOS example app for Maestro
        run: bash ./scripts/build-ios-maestro-simulator-app-ci.sh
      - name: Upload iOS Maestro app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-maestro-example-app
          path: example-app/ios/DerivedData/Build/Products/Debug-iphonesimulator/
          retention-days: 1
          compression-level: 9
  web:
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: 'Build code and test'
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Check out
        uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        id: install_code
        run: bun i
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Check Cap 9 deprecated APIs
        run: bun run check:cap9-deprecated
      - name: Lint
        id: lint_code
        run: bun run lint
      - name: Verify Maestro selectors
        run: node example-app/scripts/verify-maestro-selectors.mjs
      - name: Build
        id: build_code
        run: bun run build
      - name: Verify
        id: verify_code
        run: bun run verify:web

  maestro_android_e2e:
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Android Maestro e2e
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install root dependencies
        run: bun i
      - name: Setup java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: Install Maestro CLI
        run: |
          export MAESTRO_VERSION=1.39.0
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Build example app for Android
        env:
          CAPGO_MAESTRO_CI: '1'
        run: |
          for attempt in 1 2 3; do
            if bun run example-app:prepare:android; then
              exit 0
            fi
            echo "example-app:prepare:android failed (attempt ${attempt}/3); retrying after 15s"
            sleep 15
          done
          exit 1
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Maestro e2e (Android)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: timeout 7m bun run maestro:test:android:e2e

  maestro_ios_unavailable:
    needs: [build_ios]
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: macOS-latest
    name: iOS Maestro declared age range
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Download iOS Maestro app artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-maestro-example-app
          path: maestro-artifacts
      - name: Cache Maestro CLI
        uses: actions/cache@v4
        id: maestro-cache
        with:
          path: ~/.maestro
          key: maestro-cli-1.39.0-${{ runner.os }}
      - name: Install Maestro CLI
        if: steps.maestro-cache.outputs.cache-hit != 'true'
        run: |
          export MAESTRO_VERSION=1.39.0
          curl -fsSL "https://get.maestro.mobile.dev" | bash
      - name: Add Maestro to PATH
        run: echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Select iOS Simulator
        run: |
          IOS_SIMULATOR_UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          if [ -z "$IOS_SIMULATOR_UDID" ]; then
            echo "No available iPhone simulator found"
            exit 1
          fi
          echo "IOS_SIMULATOR_UDID=$IOS_SIMULATOR_UDID" >> "$GITHUB_ENV"
      - name: Install iOS example app on simulator
        run: bash ./scripts/install-ios-maestro-example-app-ci.sh
      - name: Run Maestro declared age range (iOS)
        run: |
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=90000 MAESTRO_CLI_NO_ANALYTICS=1
          sh ./scripts/run-ios-maestro-age-range.sh