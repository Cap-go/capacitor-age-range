appId: app.capgo.age.range
androidWebViewHierarchy: devtools
---
- launchApp:
    clearState: true
- tapOn:
    text: 'Wait'
    optional: true
    label: 'Dismiss transient emulator dialogs'
- scrollUntilVisible:
    element:
      id: 'maestro-ready'
    direction: DOWN
    timeout: 120000
- assertVisible:
    id: 'maestro-ready'
- tapOn:
    id: 'maestro-run-default-never'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Maestro default never:'
    timeout: 120000
- assertVisible: 'Maestro default never:'
- tapOn:
    id: 'maestro-run-when-mandatory'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Maestro whenMandatory:'
    timeout: 120000
- assertVisible: 'Maestro whenMandatory:'