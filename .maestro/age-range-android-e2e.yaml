appId: app.capgo.age.range
androidWebViewHierarchy: devtools
---
- launchApp:
    clearState: true
- tapOn:
    text: 'Wait'
    optional: true
    label: 'Dismiss transient emulator dialogs'
- assertVisible:
    id: 'maestro-ready'
- extendedWaitUntil:
    visible:
      id: 'maestro-run-default-never'
    timeout: 60000
- tapOn:
    id: 'maestro-run-default-never'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'maestro-outcome-default-detail'
    timeout: 45000
- assertVisible:
    id: 'maestro-outcome-default-detail'
- assertVisible: 'Maestro default never:'
- tapOn:
    id: 'maestro-run-when-mandatory'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'maestro-outcome-mandatory-detail'
    timeout: 45000
- assertVisible:
    id: 'maestro-outcome-mandatory-detail'
- assertVisible: 'Maestro whenMandatory:'