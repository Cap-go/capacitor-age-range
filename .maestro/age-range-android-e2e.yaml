appId: app.capgo.age.range
androidWebViewHierarchy: devtools
---
- launchApp:
    clearState: true
- tapOn:
    text: 'Wait'
    optional: true
    label: 'Dismiss transient emulator dialogs'
- assertVisible:
    id: 'maestro-ready'
- extendedWaitUntil:
    visible:
      id: 'maestro-run-default-never'
    timeout: 60000
- tapOn:
    id: 'maestro-run-default-never'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Maestro default never: unavailable status=NOT_AVAILABLE'
    timeout: 45000
- assertVisible: 'Maestro default never: unavailable status=NOT_AVAILABLE'
- tapOn:
    id: 'maestro-run-when-mandatory'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Maestro whenMandatory: unavailable status=NOT_AVAILABLE'
    timeout: 45000
- assertVisible: 'Maestro whenMandatory: unavailable status=NOT_AVAILABLE'