appId: app.capgo.age.range
androidWebViewHierarchy: devtools
---
- launchApp:
    clearState: true
- tapOn:
    text: 'Wait'
    optional: true
    label: 'Dismiss transient emulator dialogs'
- scrollUntilVisible:
    element:
      id: 'maestro-ready'
    direction: DOWN
    timeout: 120000
- assertVisible:
    id: 'maestro-ready'
- scrollUntilVisible:
    element:
      text: 'Maestro default (never)'
    direction: DOWN
    timeout: 90000
- tapOn:
    text: 'Maestro default (never)'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'maestro-static-default-unavailable'
    timeout: 90000
- assertVisible:
    id: 'maestro-static-default-unavailable'
- scrollUntilVisible:
    element:
      text: 'Maestro whenMandatory'
    direction: DOWN
    timeout: 60000
- tapOn:
    text: 'Maestro whenMandatory'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'maestro-static-mandatory-unavailable'
    timeout: 90000
- assertVisible:
    id: 'maestro-static-mandatory-unavailable'