appId: app.capgo.age.range
androidWebViewHierarchy: devtools
---
- launchApp:
    clearState: true
- tapOn:
    text: 'Wait'
    optional: true
- scrollUntilVisible:
    element:
      text: 'Maestro ready'
    direction: DOWN
    timeout: 240000
- extendedWaitUntil:
    visible: 'Maestro ready'
    timeout: 60000
- tapOn:
    id: 'maestro-run-when-mandatory'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: maestro-outcome-mandatory-detail
    timeout: 300000
- assertVisible:
    id: maestro-outcome-mandatory-detail
- assertVisible:
    text: '.*status=NOT_AVAILABLE.*'