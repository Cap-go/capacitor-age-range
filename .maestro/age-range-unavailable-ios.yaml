appId: app.capgo.age.range
---
- launchApp
- scrollUntilVisible:
    element:
      text: 'Maestro ready'
    direction: DOWN
    timeout: 180000
- extendedWaitUntil:
    visible: 'Maestro ready'
    timeout: 30000
- tapOn:
    text: 'Maestro default (never)'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Maestro default never:'
    timeout: 120000
- assertVisible: 'Maestro default never:'