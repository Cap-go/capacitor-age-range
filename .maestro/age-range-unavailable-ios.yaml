appId: app.capgo.age.range
---
- launchApp
- scrollUntilVisible:
    element:
      id: 'maestro-ready'
    direction: DOWN
    timeout: 120000
- assertVisible:
    id: 'maestro-ready'
- tapOn:
    id: 'maestro-run-default-never'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'maestro-static-default-unavailable'
    timeout: 90000
- assertVisible:
    id: 'maestro-static-default-unavailable'