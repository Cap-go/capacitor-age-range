appId: app.capgo.age.range
---
- launchApp
- scrollUntilVisible:
    element:
      id: 'maestro-ready'
    direction: DOWN
    timeout: 240000
- assertVisible:
    id: 'maestro-ready'
- extendedWaitUntil:
    visible: 'Maestro harness: starting'
    timeout: 120000
- extendedWaitUntil:
    visible: 'Maestro default never:'
    timeout: 180000
- assertVisible: 'Maestro default never:'