appId: app.capgo.age.range
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'maestro-ready'
    timeout: 120000
- assertVisible:
    id: 'maestro-ready'
- extendedWaitUntil:
    visible:
      id: 'maestro-run-default-never'
    timeout: 60000
- tapOn:
    id: 'maestro-run-default-never'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Maestro default never: unavailable'
    timeout: 30000
- assertVisible: 'Maestro default never: unavailable'