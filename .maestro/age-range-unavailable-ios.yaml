appId: app.capgo.age.range
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element:
      text: 'Maestro harness: boot'
    direction: DOWN
    timeout: 120000
- assertVisible: 'Maestro ready'
- scrollUntilVisible:
    element:
      text: 'Maestro default (never)'
    direction: DOWN
    timeout: 60000
- tapOn:
    text: 'Maestro default (never)'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Maestro default never:'
    timeout: 60000
- assertVisible: 'Maestro default never:'