appId: app.capgo.age.range
---
- launchApp
- assertVisible:
    id: 'maestro-ready'
- extendedWaitUntil:
    visible:
      id: 'maestro-run-default-never'
    timeout: 60000
- tapOn:
    id: 'maestro-run-default-never'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'maestro-static-default-unavailable'
    timeout: 60000
- assertVisible:
    id: 'maestro-static-default-unavailable'