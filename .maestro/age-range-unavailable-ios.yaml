appId: app.capgo.age.range
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'maestro-run-default-never'
    timeout: 90000
- tapOn:
    id: 'maestro-run-default-never'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'maestro-outcome-default-detail'
    timeout: 45000
- assertVisible:
    id: 'maestro-outcome-default-detail'