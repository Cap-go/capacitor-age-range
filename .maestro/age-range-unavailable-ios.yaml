appId: app.capgo.age.range
---
- launchApp
- scrollUntilVisible:
    element:
      id: 'maestro-ready'
    direction: DOWN
    timeout: 120000
- assertVisible:
    id: 'maestro-ready'
- tapOn:
    id: 'maestro-run-default-never'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Maestro default never:'
    timeout: 120000
- assertVisible: 'Maestro default never:'