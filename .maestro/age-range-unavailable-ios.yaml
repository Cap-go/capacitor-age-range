appId: app.capgo.age.range
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Maestro ready'
    timeout: 180000
- tapOn:
    id: 'maestro-run-default-never'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Maestro default never: unavailable'
    timeout: 60000
- assertVisible: 'Maestro default never: unavailable'